<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#23272b;font:15px system-ui}
.wrap{max-width:780px;padding:2px 4px}
#map{position:relative;width:100%;aspect-ratio:1;overflow:hidden;cursor:crosshair;border-radius:14px;border:1px solid #bcbfc5;
background:linear-gradient(90deg,transparent 49.85%,#68696580 50%,transparent 50.15%),linear-gradient(transparent 49.7%,#68696580 50%,transparent 50.3%),conic-gradient(from 0deg,#f8dfbc,#f5eaca,#d5e8df,#dbdaee,#edcfca,#f8dfbc);touch-action:none}
#map span{position:absolute;pointer-events:none;font-weight:600;padding:12px}
.right{right:0}.bottom{bottom:0}
#point{position:absolute;width:18px;height:18px;border-radius:50%;background:#242927;border:3px solid white;box-shadow:0 0 0 1px #333;transform:translate(-50%,-50%);pointer-events:none}
</style>
<div class="wrap"><div id="map" aria-label="Atmosphere map. Adjust emotional tone and energy using the adjacent sliders.">
<span>Tense</span><span class="right">Exhilarating</span><span class="bottom">Uneasy</span><span class="right bottom">Peaceful</span><i id="point"></i></div>
</div>
<script>
const map=document.querySelector('#map'), point=document.querySelector('#point');
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type:'streamlit:'+type,...data},'*');
let position=[0,0];
function draw(values){
 position=values.map(v=>Math.max(-100,Math.min(100,v)));
 point.style.left=(50+position[0]/2)+'%';
 point.style.top=(50-position[1]/2)+'%';
}
function commit(){send('setComponentValue',{value:position,dataType:'json'})}
function move(e){const r=map.getBoundingClientRect();draw([Math.round(200*(e.clientX-r.left)/r.width-100),Math.round(100-200*(e.clientY-r.top)/r.height)])}
map.onpointerdown=e=>{map.setPointerCapture(e.pointerId);move(e)};
map.onpointermove=e=>{if(map.hasPointerCapture(e.pointerId))move(e)};
map.onpointerup=e=>{move(e);commit()};
window.addEventListener('message',e=>{
 if(e.source===parent && e.data.type==='streamlit:render'){draw(e.data.args.current);size()}
});
function size(){send('setFrameHeight',{height:document.querySelector('.wrap').offsetHeight+8})}
new ResizeObserver(size).observe(document.querySelector('.wrap'));
send('componentReady',{apiVersion:1});
</script>
